<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>fERP</title>
    <link rel="stylesheet" href="css/popup.css" />
</head>

<body>
    <header>
        <a href="https://github.com/proffapt/fERP" target="_blank" title="fERP on GitHub">
            <img src="images/fERP64.png" alt="" />
        </a>
        <div>
            <h1>fERP</h1>
            <p>Fill your ERP feedback form in one click</p>
        </div>
    </header>

    <main>
        <button class="btn positive" data-type="positive">
            <span class="dot"></span>Positive
            <small>Very good / excellent</small>
        </button>
        <button class="btn neutral" data-type="neutral">
            <span class="dot"></span>Neutral
            <small>Good / average</small>
        </button>
        <button class="btn negative" data-type="negative">
            <span class="dot"></span>Negative
            <small>Poor / fair</small>
        </button>

        <div id="status" class="status" hidden></div>
        <p class="hint">Open a course's feedback form, pick a type, review it, then type the captcha and press Enter.</p>
    </main>

    <footer>
        <a href="https://github.com/proffapt/fERP#readme" target="_blank">Guide</a>
        <span>·</span>
        <a href="https://github.com/proffapt/fERP/issues" target="_blank">Report an issue</a>
        <span>·</span>
        <a href="https://proffapt.hashnode.dev" target="_blank">About</a>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
